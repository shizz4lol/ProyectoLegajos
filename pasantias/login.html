<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>LEGAJOS - EPET N°20 - Ingresar</title>
<link rel="stylesheet" href="legajo.css">
</head>
<body>

<header class="topbar">
  <div class="logo">
  <img src="imagen epet20/images.jpg" alt="Escudo EPET 20" style="width:40px;height:40px;border-radius:50%;object-fit:cover;">
    <div class="txt"><b>LEGAJOS</b><span>EPET N°20</span></div>
  </div>
</header>

<div class="login-wrap">
  <h2>Ingrese clave</h2>

  <div class="login-field">
    <input type="password" placeholder="Ingrese su clave">
    <span class="icono">&#128274;</span>
  </div>

  <div class="login-rol">
    <label for="rol">Rol</label>
    <div class="select-wrap">
      <select id="rol" name="rol">
        <option value="" selected disabled>Seleccione un rol</option>
        <option value="secretaria">Secretaría</option>
        <option value="jefe">Jefe de Preceptores</option>
        <option value="preceptor">Preceptor</option>
      </select>
      <span class="icono">&#9662;</span>
    </div>
  </div>

  <a class="login-btn" href="secretaria.html">Ingresar</a>


</body>
</html>
