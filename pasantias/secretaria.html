<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LEGAJOS - EPET N°20</title>
  <link rel="stylesheet" href="tu_estilo.css">
</head>
<body>

  
  <header class="topbar">
    <button class="ham-btn">&#9776;</button>
    
    <div class="logo">
      <div class="txt">
        <b>LEGAJOS</b> <span>EPET N°20</span>
      </div>
    </div>

    <div class="bienvenida-top">
      <b>¡Bienvenido/a, Secretaría!</b>
      <span>Sistema de Gestión de Legajos</span>
    </div>

    
  </header>

  <div class="layout-container">
    
    <!-- BARRA LATERAL -->
    <aside class="sidebar">
      <div>
        <div class="item act"><span class="ic">&#8962;</span>Inicio</div>
        <div class="item"><span class="ic">&#127891;</span>Cursos</div>
        <div class="item"><span class="ic">&#128101;</span>Alumnos</div>
      </div>
      
      <a class="salir" href="#" onclick="document.getElementById('modalLogout').style.display='flex'; return false;">
        <span class="ic">&#128682;</span>Cerrar sesión
      </a>
    </aside>

    
    <main class="main-content">
      
      <div class="panel-card">
        <h3>Panel principal</h3>
        <p class="sub">Resumen general del sistema</p>
      </div>

     
      <div class="stats-row">
        <div class="stat-box blue">
          <div class="ic">&#128101;</div>
          <div>
            <div class="lbl">Alumnos totales</div>
            <div class="num">512</div>
          </div>
        </div>
        
        <div class="stat-box purple">
          <div class="ic">&#128196;</div>
          <div>
            <div class="lbl">Documentos</div>
            <div class="num">1.256</div>
          </div>
        </div>
      </div>

    

    </main>
  </div>


  <div class="overlay" id="modalLogout" style="display:none;">
    <div class="modal-confirm">
      <p>¿Seguro que querés cerrar sesión?</p>
      <div class="fila-btn">
        <button class="btn-secundario" onclick="document.getElementById('modalLogout').style.display='none'">Cancelar</button>
        <a class="btn-primario" style="background:#dc2626;" href="login.html">Cerrar sesión</a>
      </div>
    </div>
  </div>

</body>
</html>
