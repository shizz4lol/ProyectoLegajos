<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>EPET 20 - Legajos</title>
<style>
  :root{
    --azul-oscuro:#12206b;
    --azul-medio:#1e3a8a;
    --azul-cielo:#3b82f6;
    --azul-claro:#dbeafe;
    --gris-borde:#d7ddea;
    --gris-texto:#3a3f55;
    --gris-suave:#f4f6fb;
    --mañana:#1d4ed8;
    --tarde:#ea580c;
    --vespertino:#6d28d9;
    --secretaria:#0d9488;
    --jefe:#a16207;
    --preceptor:#c2410c;
    --rojo:#b91c1c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI', Arial, sans-serif;background:var(--gris-suave);color:var(--gris-texto);}
  .browser-chrome{background:#e8eaf0;padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#666;border-bottom:1px solid #ccc;}
  .browser-chrome .url{background:#fff;border-radius:14px;padding:5px 14px;flex:1;border:1px solid #ddd;color:#555;}

  /* ---------- LOGIN ---------- */
  .login-page{min-height:600px;}
  .login-topbar{background:var(--azul-oscuro);padding:16px 26px;display:flex;align-items:center;gap:12px;}
  .login-topbar .shield-lg{width:42px;height:42px;border-radius:50%;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:19px;}
  .login-topbar b{color:#fff;font-size:15px;display:block;letter-spacing:.3px;}
  .login-topbar span{color:#cfd8ff;font-size:11.5px;}
  .login-center{max-width:380px;margin:90px auto 0;text-align:center;padding:0 20px;}
  .login-center h2{color:var(--azul-oscuro);font-size:22px;margin:0 0 22px;}
  .clave-wrap{position:relative;margin-bottom:14px;}
  .clave-wrap input{width:100%;padding:13px 40px 13px 16px;border:1.5px solid var(--gris-borde);border-radius:8px;font-size:14.5px;outline:none;background:#fff;}
  .clave-wrap input:focus{border-color:var(--azul-cielo);}
  .clave-wrap .lock-ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9aa1b8;font-size:15px;}
  .login-center button{width:100%;background:var(--azul-medio);color:#fff;border:none;padding:13px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;}
  .login-center button:hover:not(:disabled){background:var(--azul-oscuro);}
  .login-center button:disabled{opacity:.5;cursor:not-allowed;}
  .login-error{background:#fef2f2;color:var(--rojo);font-size:12.5px;padding:9px 12px;border-radius:6px;margin-top:14px;}
  .login-bloqueo{background:#fef2f2;color:var(--rojo);font-size:12.5px;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-weight:600;}
  .login-demo{margin-top:26px;font-size:11.5px;color:#9aa1b8;border-top:1px solid var(--gris-borde);padding-top:14px;}

  /* ---------- APP SHELL ---------- */
  .app-shell{display:flex;flex-direction:column;min-height:640px;}
  .body-row{display:flex;flex:1;align-items:stretch;}

  /* ---------- TOPBAR (oscura) ---------- */
  .topbar{background:var(--azul-oscuro);color:#fff;padding:13px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .ham{background:#ffffff1a;border:1px solid #ffffff33;width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;color:#fff;flex-shrink:0;}
  .ham:hover{background:#ffffff30;}
  .brand{display:flex;align-items:center;gap:9px;padding-right:16px;border-right:1px solid #ffffff2e;}
  .brand .shield{width:38px;height:38px;border-radius:50%;background:#ffffff22;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .brand b{display:block;font-size:14px;color:#fff;letter-spacing:.3px;}
  .brand span{font-size:10.5px;color:#c7d2fe;}
  .bienvenida-txt{padding-right:8px;}
  .bienvenida-txt b{display:block;color:#fff;font-size:14.5px;}
  .bienvenida-txt span{font-size:11px;color:#c7d2fe;}
  .search-top{flex:1;max-width:320px;margin-left:auto;position:relative;min-width:160px;}
  .search-top input{width:100%;padding:9px 38px 9px 14px;border:none;border-radius:20px;font-size:13.5px;outline:none;background:#fff;color:var(--gris-texto);}
  .search-top button{position:absolute;right:4px;top:4px;bottom:4px;width:29px;background:var(--azul-medio);border:none;border-radius:50%;color:#fff;cursor:pointer;font-size:12px;}
  .perfil-chip{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 12px 5px 6px;border-radius:20px;position:relative;}
  .perfil-chip:hover{background:#ffffff16;}
  .perfil-chip .av2{width:32px;height:32px;border-radius:50%;background:#ffffff26;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0;}
  .perfil-chip .txt b{display:block;font-size:12.5px;color:#fff;}
  .perfil-chip .txt span{font-size:10.5px;color:#c7d2fe;}
  .perfil-dropdown{position:absolute;top:44px;right:0;background:#fff;border:1px solid var(--gris-borde);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.16);min-width:160px;z-index:60;overflow:hidden;}
  .perfil-dropdown .opt{padding:11px 16px;font-size:13px;color:var(--rojo);cursor:pointer;font-weight:600;}
  .perfil-dropdown .opt:hover{background:#fef2f2;}
  .perfil-chip > span:nth-child(3){color:#c7d2fe;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{width:225px;flex-shrink:0;background:var(--azul-oscuro);display:flex;flex-direction:column;transition:width .2s ease;}
  .sidebar.colapsada{width:60px;}
  .sidebar .item{display:flex;align-items:center;gap:10px;padding:14px 18px;font-size:13.5px;font-weight:600;color:#c7d2fe;cursor:pointer;white-space:nowrap;}
  .sidebar .item:hover{background:#ffffff14;}
  .sidebar .item.act{background:#2f52d9;color:#fff;}
  .sidebar .item .ic{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
  .sidebar.colapsada .item{justify-content:center;padding:14px 0;}
  .sidebar.colapsada .item .label{display:none;}
  .sidebar .logout-item{margin-top:auto;color:#fca5a5;border-top:1px solid #ffffff1f;}
  .sidebar .logout-item:hover{background:#7f1d1d40;}

  .content-area{flex:1;padding:26px 30px 60px;background:var(--gris-suave);min-width:0;}
  .breadcrumb-inline{font-size:13px;color:#556;margin-bottom:16px;}
  .breadcrumb-inline span{cursor:pointer;color:var(--azul-medio);}
  .breadcrumb-inline span:hover{text-decoration:underline;}
  .breadcrumb-inline .sep{color:#aab;margin:0 6px;}

  h2.section-title{color:var(--azul-oscuro);font-size:20px;margin:0 0 4px;}
  .section-sub{font-size:13px;color:#7a8199;margin:0 0 18px;}

  /* ---------- STAT CARD (Inicio) ---------- */
  .stats-cards{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .stat-card{background:#fff;border:1px solid var(--gris-borde);border-radius:12px;padding:18px 26px;display:flex;align-items:center;gap:18px;min-width:260px;}
  .stat-card .icon-circle{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .stat-card.azul .icon-circle{background:#ede9fe;color:#6d28d9;}
  .stat-card .num{font-size:26px;font-weight:800;color:var(--azul-oscuro);line-height:1.2;}
  .stat-card .lbl{font-size:13px;color:#7a8199;}

  /* ---------- ACORDEÓN CURSOS (Inicio) ---------- */
  .cursos-acc{background:#fff;border:1px solid var(--gris-borde);border-radius:10px;padding:20px 22px;}
  .cursos-acc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:16px;color:var(--azul-oscuro);font-weight:800;font-size:16px;}
  .acc-anio{border-bottom:1px solid var(--gris-borde);}
  .acc-anio:last-child{border-bottom:none;}
  .acc-anio-head{display:flex;align-items:center;gap:8px;padding:11px 2px;cursor:pointer;font-weight:700;color:var(--azul-oscuro);font-size:14.5px;}
  .acc-anio-head .chevron{display:inline-block;transition:transform .15s;font-size:11px;}
  .acc-anio-head.abierto .chevron{transform:rotate(180deg);}
  .acc-cursos-list{padding:0 2px 14px;display:flex;flex-direction:column;gap:8px;}
  .acc-curso-row{display:flex;align-items:center;justify-content:space-between;background:var(--gris-suave);border:1px solid var(--gris-borde);border-radius:8px;padding:14px 18px;cursor:pointer;font-size:14px;font-weight:600;}
  .acc-curso-row:hover{background:var(--azul-claro);}

  /* ---------- CURSOS (tarjetas, sin cambios) ---------- */
  .anio-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .anio-tabs button{border:1.5px solid var(--gris-borde);background:#fff;padding:7px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;color:var(--gris-texto);}
  .anio-tabs button.act{background:var(--azul-medio);border-color:var(--azul-medio);color:#fff;}
  .grupo-anio{margin-bottom:22px;}
  .grupo-anio .titulo-anio{font-size:13px;font-weight:800;color:var(--azul-oscuro);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;}
  .cursos-row{display:flex;gap:14px;flex-wrap:wrap;}
  .curso-card{background:#fff;border:1px solid var(--gris-borde);border-radius:10px;padding:16px;cursor:pointer;transition:box-shadow .15s, transform .15s;border-top:6px solid #ccc;width:210px;flex:0 0 auto;}
  .curso-card:hover{box-shadow:0 6px 18px rgba(18,32,107,.14);transform:translateY(-2px);}
  .curso-card.turno-mañana{border-top-color:var(--mañana);}
  .curso-card.turno-tarde{border-top-color:var(--tarde);}
  .curso-card.turno-vespertino{border-top-color:var(--vespertino);}
  .curso-card .nombre{font-size:16px;font-weight:800;color:var(--azul-oscuro);margin-bottom:6px;}
  .curso-card .cant{font-size:12px;color:#7a8199;margin-bottom:10px;}
  .chip-turno{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;color:#fff;display:inline-block;}
  .chip-mañana{background:var(--mañana);}
  .chip-tarde{background:var(--tarde);}
  .chip-vespertino{background:var(--vespertino);}
  .leyenda{display:flex;gap:18px;margin-bottom:18px;font-size:12.5px;color:#556;flex-wrap:wrap;}
  .leyenda span{display:flex;align-items:center;gap:6px;}
  .leyenda i{width:12px;height:12px;border-radius:3px;display:inline-block;}

  .search-bar{display:flex;gap:10px;margin-bottom:14px;}
  .search-bar input{flex:1;padding:12px 16px;border:1.5px solid var(--gris-borde);border-radius:8px;font-size:15px;outline:none;}
  .search-bar input:focus{border-color:var(--azul-cielo);}
  .filtros-alumnos{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .filtros-alumnos select{padding:9px 12px;border:1.5px solid var(--gris-borde);border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;}

  .alumnos-tabla{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .alumnos-tabla th{background:var(--azul-medio);color:#fff;text-align:left;padding:11px 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;}
  .alumnos-tabla td{padding:12px 14px;border-bottom:1px solid var(--gris-borde);font-size:14.5px;}
  .alumnos-tabla tr:last-child td{border-bottom:none;}
  .alumnos-tabla tbody tr{cursor:pointer;}
  .alumnos-tabla tbody tr:hover{background:var(--azul-claro);}
  .estado{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:12px;background:#dcfce7;color:#15803d;}
  .empty{text-align:center;padding:50px 20px;color:#9aa1b8;}

  /* ---------- MODALES ---------- */
  .overlay{position:fixed;inset:0;background:rgba(18,32,107,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;}
  .modal-curso{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:0;}
  .modal-curso .modal-head{padding:18px 22px;border-bottom:1px solid var(--gris-borde);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;}
  .modal-curso .modal-head h3{margin:0;color:var(--azul-oscuro);font-size:18px;}
  .modal-curso .modal-head .cerrar{cursor:pointer;font-size:20px;color:#9aa1b8;border:none;background:none;}
  .modal-curso .modal-body{padding:18px 22px;}

  /* ---------- FORM CREAR LEGAJO ---------- */
  .form-crear{background:#fff;border:1px solid var(--gris-borde);border-radius:10px;padding:24px;max-width:640px;}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;}
  .form-grid .full{grid-column:1 / -1;}
  .form-crear label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:#7a8199;display:block;margin-bottom:5px;}
  .form-crear label .req{color:var(--rojo);}
  .form-crear input, .form-crear select{width:100%;padding:9px 11px;border:1.5px solid var(--gris-borde);border-radius:7px;font-size:14px;font-family:inherit;}
  .form-crear .check-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .form-crear .check-row input{width:auto;}
  .form-crear button{margin-top:18px;background:var(--secretaria);color:#fff;border:none;padding:11px 22px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;}
  .form-crear button:hover{opacity:.9;}
  .form-hint{font-size:12px;color:#9aa1b8;margin:-6px 0 16px;}

  .toast{margin-top:14px;background:#166534;color:#fff;padding:10px 14px;border-radius:7px;font-size:13px;}
  .toast-error{background:var(--rojo);}

  /* ---------- LEGAJO DEL ALUMNO (nuevo diseño) ---------- */
  .legajo-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
  .legajo-top .titulo-wrap{display:flex;gap:14px;align-items:center;}
  .legajo-top .icono-cuadrado{width:50px;height:50px;border-radius:12px;background:var(--azul-claro);color:var(--azul-medio);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .legajo-top h2{margin:0;color:var(--azul-oscuro);font-size:21px;}
  .legajo-top p{margin:2px 0 0;color:#7a8199;font-size:13px;}
  .btn-volver-lista{background:#fff;border:1.5px solid var(--gris-borde);color:var(--gris-texto);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  .btn-volver-lista:hover{background:var(--gris-suave);}

  .legajo-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
  .legajo-card{background:#fff;border:1px solid var(--gris-borde);border-radius:12px;padding:22px 24px;}
  .legajo-card h4{margin:0 0 16px;color:var(--azul-oscuro);font-size:15.5px;}
  .avatar-generico{width:62px;height:62px;border-radius:50%;background:#e5e7eb;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;}
  .legajo-nombre-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .legajo-nombre-row .nombre-al{font-size:18px;font-weight:800;color:var(--azul-oscuro);}
  .pill-estado{font-size:11px;font-weight:800;padding:3px 11px;border-radius:12px;}
  .pill-activo{background:#dcfce7;color:#15803d;}
  .pill-egresado{background:#ede9fe;color:#6d28d9;}
  .campo-icono-list{display:flex;flex-direction:column;gap:12px;}
  .campo-icono{display:flex;gap:9px;font-size:13.5px;align-items:center;flex-wrap:wrap;}
  .campo-icono .ic{width:18px;flex-shrink:0;}
  .campo-icono b{color:var(--gris-texto);font-weight:700;margin-right:2px;}
  .campo-icono span.val{color:#556;}
  .campo-icono input{flex:1;min-width:140px;padding:6px 9px;border:1.5px solid var(--azul-cielo);border-radius:6px;font-size:13.5px;font-family:inherit;}
  .obs-textarea{width:100%;min-height:60px;padding:8px 10px;border:1.5px solid var(--azul-cielo);border-radius:6px;font-family:inherit;font-size:13.5px;resize:vertical;}

  .doc-check-list{display:flex;flex-direction:column;gap:12px;}
  .doc-check-item{display:flex;align-items:center;gap:10px;font-size:13.5px;}
  .doc-check-item .chk{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;font-weight:800;}
  .doc-check-item .chk.si{background:#dcfce7;color:#15803d;}
  .doc-check-item .chk.no{background:#f1f5f9;color:#cbd5e1;}
  .doc-check-item input[type=checkbox]{width:16px;height:16px;}

  .otra-escuela-edit{margin-top:6px;padding-top:14px;border-top:1px solid var(--gris-borde);}
  .otra-escuela-edit .check-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px;font-weight:600;}
  .otra-escuela-edit input[type=text]{width:100%;padding:8px 10px;border:1.5px solid var(--gris-borde);border-radius:6px;font-size:13px;font-family:inherit;}

  .procedencia-card{margin-top:18px;background:#eef4ff;border:1px solid #c6d8fb;border-radius:8px;padding:14px 18px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;}
  .procedencia-card .icono{font-size:18px;}
  .procedencia-card b{color:var(--azul-oscuro);}
  .egreso-card{margin-top:18px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:16px 18px;}
  .egreso-card .titulo-egreso{font-weight:700;color:#166534;margin-bottom:4px;font-size:14.5px;}
  .egreso-card p{margin:0 0 12px;font-size:13px;color:#3a3f55;}
  .btn-titulo{background:#166534;color:#fff;border:none;padding:10px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn-titulo:hover{opacity:.9;}

  .acciones-centradas{display:flex;gap:12px;justify-content:center;margin-top:22px;}
  .btn-editar{background:var(--azul-medio);color:#fff;border:none;padding:11px 22px;border-radius:8px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .btn-editar:hover{opacity:.9;}
  .btn-secundario{background:#fff;color:var(--gris-texto);border:1.5px solid var(--gris-borde);padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-secundario:hover{background:var(--gris-suave);}
  .no-permiso{text-align:center;padding:70px 20px;color:#9a3412;}

  @media(max-width:820px){ .legajo-grid{grid-template-columns:1fr;} }
</style>
</head>

];

const alumnosPorCurso = {

    {dni:'44123001', nombre:'Benegas Pía Eugenia', estado:'Activo'},
    {dni:'44123002', nombre:'Fernández Tomás', estado:'Activo'},

  ],

  ],

    {dni:'43980022', nombre:'Gómez Sofía', estado:'Activo'},
  ],

  ],
  '3A':[
    {dni:'43700045', nombre:'Navarro Camila', estado:'Activo'},
  ],

// ---------- LOGIN: bloqueo por intentos fallidos ----------
let intentosFallidos = 0;
let bloqueadoHasta = null;
let timerBloqueo = null;
function segundosRestantes(){
  if(!bloqueadoHasta) return 0;
  return Math.max(0, Math.ceil((bloqueadoHasta - Date.now()) / 1000));
}
function iniciarCuentaRegresiva(){
  if(timerBloqueo) clearInterval(timerBloqueo);
  timerBloqueo = setInterval(() => {
    if(segundosRestantes() <= 0){
      clearInterval(timerBloqueo); timerBloqueo = null; bloqueadoHasta = null; render();
    } else {
      const span = document.getElementById('segundosRestantes');
      if(span) span.textContent = segundosRestantes();
    }
  }, 1000);
}
function login(){
  if(segundosRestantes() > 0) return;
  const clave = document.getElementById('loginClave').value;
  const found = clavesRoles[clave];
  if(!found){
    intentosFallidos++;
    if(intentosFallidos >= 3){
      bloqueadoHasta = Date.now() + 30000;
      intentosFallidos = 0;
      iniciarCuentaRegresiva();
      render();
      return;
    }
    const errBox = document.getElementById('loginErr');
    if(errBox){ errBox.style.display='block'; errBox.textContent = `Clave incorrecta. Intento ${intentosFallidos} de 3.`; }
    return;
  }
  intentosFallidos = 0;
  currentUser = found;
  irDashboard('inicio');
}

function render(){
  const app = document.getElementById('app');
  if(vista.tipo === 'login'){ app.innerHTML = vistaLogin(); return; }
  app.innerHTML = layoutApp();

  if(vista.tipo === 'dashboard' && vista.panel === 'alumnos'){
    const input = document.getElementById('inputBuscarAlumno');
    if(input){ input.addEventListener('input', e=>{ busquedaAlumnos = e.target.value; renderResultadosAlumnos(); }); }
    const selCurso = document.getElementById('filtroCurso');
    if(selCurso){ selCurso.addEventListener('change', e=>{ filtroCursoAlumnos = e.target.value; renderResultadosAlumnos(); }); }
    const selTurno = document.getElementById('filtroTurno');
    if(selTurno){ selTurno.addEventListener('change', e=>{ filtroTurnoAlumnos = e.target.value; renderResultadosAlumnos(); }); }
    renderResultadosAlumnos();
  }
  if(vista.tipo === 'dashboard' && cursoModalAbierto){
    app.insertAdjacentHTML('beforeend', modalCurso(cursoModalAbierto));
  }
  if(confirmandoLogout){
    app.insertAdjacentHTML('beforeend', modalConfirmLogout());
  }
}

function renderResultadosAlumnos(){
  const cont = document.getElementById('resultadosAlumnos');
  if(!cont) return;
  const q = busquedaAlumnos.trim().toLowerCase();
  let cursosOk = cursosVisibles();
  if(filtroCursoAlumnos !== 'todos') cursosOk = cursosOk.filter(c => c.id === filtroCursoAlumnos);
  if(filtroTurnoAlumnos !== 'todos') cursosOk = cursosOk.filter(c => c.turno === filtroTurnoAlumnos);
  let filas = [];
  cursosOk.forEach(c => {
    (alumnosPorCurso[c.id]||[]).forEach(a => {
      if(a.estado==='Activo' && (q==='' || a.nombre.toLowerCase().includes(q) || a.dni.includes(q))){
        filas.push({...a, cursoId:c.id, cursoNombre:c.nombre, turno:c.turno});
      }
    });
  });
  if(filas.length===0){ cont.innerHTML = `<div class="empty">No se encontraron alumnos que coincidan con la búsqueda.</div>`; return; }
  cont.innerHTML = `
    <table class="alumnos-tabla">
      <thead><tr><th>DNI</th><th>Apellido y Nombre</th><th>Curso</th><th>Turno</th><th>Estado</th></tr></thead>
      <tbody>${filas.map(a => `<tr onclick="irAlumno('${a.cursoId}','${a.dni}','alumnos')"><td>${a.dni}</td><td>${a.nombre}</td><td>${a.cursoNombre}</td><td>${a.turno}</td><td><span class="estado">${a.estado}</span></td></tr>`).join('')}</tbody>
    </table>
  `;
}

// ---------- CREAR LEGAJO ----------
function panelCrearLegajo(){
  const opcionesCurso = cursos.map(c => `<option value="${c.id}">${c.nombre} · ${c.turno}</option>`).join('');
  return `
    <h2 class="section-title">Crear nuevo Legajo</h2>
    <p class="section-sub">Disponible solo para Secretaría. Digitalizá los datos recopilados de la planilla física del alumno.</p>
    <div class="form-crear">
      <div class="form-grid">
        <div><label>Apellido y Nombre <span class="req">*</span></label><input id="nfNombre" type="text" placeholder="Ej: Pérez Juan"></div>
        <div><label>DNI <span class="req">*</span></label><input id="nfDni" type="text" placeholder="Ej: 45123456"></div>
        <div><label>Curso / Turno <span class="req">*</span></label><select id="nfCurso">${opcionesCurso}</select></div>
        <div><label>Fecha de nacimiento</label><input id="nfNacimiento" type="text" placeholder="dd/mm/aaaa"></div>
        <div><label>Dirección <span class="req">*</span></label><input id="nfDireccion" type="text" placeholder="Calle y número, localidad"></div>
        <div><label>Teléfono <span class="req">*</span></label><input id="nfTel" type="text" placeholder="0299-..."></div>
        <div><label>Adulto Responsable (Tutor) <span class="req">*</span></label><input id="nfTutor" type="text" placeholder="Apellido y nombre"></div>
        <div><label>Gmail del alumno</label><input id="nfGmail" type="text" placeholder="alumno@gmail.com"></div>
        <div class="full"><div class="check-row"><input id="nfOtraEscuelaCheck" type="checkbox" onchange="document.getElementById('nfEscuelaOrigenWrap').style.display=this.checked?'block':'none'"> <label style="margin:0">El alumno proviene de otra escuela</label></div></div>
        <div class="full" id="nfEscuelaOrigenWrap" style="display:none"><label>Escuela de origen</label><input id="nfEscuelaOrigen" type="text" placeholder="Ej: Escuela N°5 'Confluencia'"></div>
      </div>
      <div class="form-hint"><span class="req">*</span> Campos obligatorios del alumno y del adulto responsable. No se permite guardar hasta completarlos.</div>
      <button onclick="crearLegajo()">Guardar Legajo</button>
      ${toastMsg ? `<div class="toast ${toastTipo==='error'?'toast-error':''}">${toastMsg}</div>` : ''}
    </div>
  `;
}
function crearLegajo(){
  const nombre = document.getElementById('nfNombre').value.trim();
  const dni = document.getElementById('nfDni').value.trim();
  const cursoId = document.getElementById('nfCurso').value;
  const direccion = document.getElementById('nfDireccion').value.trim();
  const tel = document.getElementById('nfTel').value.trim();
  const tutor = document.getElementById('nfTutor').value.trim();
  if(!nombre || !dni || !direccion || !tel || !tutor){
    toastTipo = 'error';
    toastMsg = 'Faltan datos críticos obligatorios del estudiante o del tutor. Completá todos los campos marcados con *.';
    render(); return;
  }
  if(dniYaExiste(dni)){
    toastTipo = 'error';
    toastMsg = `Ya existe un legajo registrado con el DNI ${dni}. No se puede crear un duplicado.`;
    render(); return;
  }
  if(!alumnosPorCurso[cursoId]) alumnosPorCurso[cursoId] = [];
  alumnosPorCurso[cursoId].push({dni, nombre, estado:'Activo'});
  fichaExtra[dni] = {
    direccion, tel,
    mail: `${dni}@alumnos.neuquen.edu.ar`,
    gmail: document.getElementById('nfGmail').value.trim() || '—',
    nacimiento: document.getElementById('nfNacimiento').value.trim() || '—',
    tutor,
    otraEscuela: document.getElementById('nfOtraEscuelaCheck').checked ? (document.getElementById('nfEscuelaOrigen').value.trim() || 'Proviene de otra escuela') : null,
    observaciones: '',
    documentos: documentosVacios(),
  };
  vista = {tipo:'alumno', cursoId, dni, origen:'alumnos'};
  cursoModalAbierto = null; editando = false; edicionTemp = null;
  toastTipo = 'ok';
  toastMsg = 'Legajo creado correctamente y almacenado en el sistema.';
  render();
}

// ---------- EDICIÓN DE FICHA (con estado temporal para no perder datos) ----------
function iniciarEdicion(dni){
  const extra = datosAlumno(dni);
  edicionTemp = {
    direccion: extra.direccion,
    tel: extra.tel,
    tutor: extra.tutor,
    observaciones: extra.observaciones || '',
    otraEscuelaCheck: !!extra.otraEscuela,
    escuelaOrigen: extra.otraEscuela || '',
    documentos: {...(extra.documentos || documentosVacios())},
  };
  editando = true;
  toastMsg = null;
  render();
}
function cancelarEdicion(){ editando = false; edicionTemp = null; toastMsg = null; render(); }
function toggleDocumentoEdit(key){ edicionTemp.documentos[key] = !edicionTemp.documentos[key]; render(); }
function toggleOtraEscuelaEdit(){ edicionTemp.otraEscuelaCheck = !edicionTemp.otraEscuelaCheck; render(); }
function guardarEdicion(dni){
  if(!fichaExtra[dni]) fichaExtra[dni] = datosAlumno(dni);
  fichaExtra[dni].direccion = edicionTemp.direccion.trim() || fichaExtra[dni].direccion;
  fichaExtra[dni].tel = edicionTemp.tel.trim() || fichaExtra[dni].tel;
  fichaExtra[dni].tutor = edicionTemp.tutor.trim() || fichaExtra[dni].tutor;
  fichaExtra[dni].observaciones = edicionTemp.observaciones.trim();
  fichaExtra[dni].otraEscuela = edicionTemp.otraEscuelaCheck ? (edicionTemp.escuelaOrigen.trim() || 'Proviene de otra escuela') : null;
  fichaExtra[dni].documentos = {...edicionTemp.documentos};
  editando = false;
  edicionTemp = null;
  toastTipo = 'ok';
  toastMsg = 'Cambios guardados. El historial del legajo fue actualizado.';
  render();
}
function generarTitulo(cursoId, dni, nombre, gmail){
  const alumno = alumnosPorCurso[cursoId].find(a=>a.dni===dni);
  if(alumno) alumno.estado = 'Egresado';
  toastTipo = 'ok';
  toastMsg = `Título generado en PDF y enviado a ${gmail}. El legajo de ${nombre} fue archivado en "Legajos Egresados".`;
  render();
}
function descargarPDF(nombre){
  toastTipo = 'ok';
  toastMsg = `Legajo de ${nombre} descargado en PDF.`;
  render();
}

function vistaAlumno(cursoId, dni){
  const curso = cursos.find(c=>c.id===cursoId);
  const alumno = alumnosPorCurso[cursoId].find(a=>a.dni===dni);
  const extra = datosAlumno(dni);
  const editable = puedeEditar();
  const esProximoAEgresar = curso.anio === 6 && alumno.estado === 'Activo';
  const estadoPillClass = alumno.estado === 'Egresado' ? 'pill-egresado' : 'pill-activo';
  const documentos = editando ? edicionTemp.documentos : (extra.documentos || documentosVacios());

  const camposIzq = editando ? `
    <div class="campo-icono"><span class="ic">🆔</span><b>DNI:</b><span class="val">${alumno.dni}</span></div>
    <div class="campo-icono"><span class="ic">🎓</span><b>Curso:</b><span class="val">${curso.nombre}</span></div>
    <div class="campo-icono"><span class="ic">📅</span><b>Nacimiento:</b><span class="val">${extra.nacimiento}</span></div>
    <div class="campo-icono"><span class="ic">📍</span><b>Domicilio:</b><input value="${edicionTemp.direccion}" oninput="edicionTemp.direccion=this.value"></div>
    <div class="campo-icono"><span class="ic">📞</span><b>Teléfono:</b><input value="${edicionTemp.tel}" oninput="edicionTemp.tel=this.value"></div>
    <div class="campo-icono"><span class="ic">👤</span><b>Tutor:</b><input value="${edicionTemp.tutor}" oninput="edicionTemp.tutor=this.value"></div>
    <div class="campo-icono"><span class="ic">✉️</span><b>Email:</b><span class="val">${extra.mail}</span></div>
    <div>
      <label style="display:block;font-size:11.5px;text-transform:uppercase;color:#9aa1b8;margin-bottom:4px;">Observaciones</label>
      <textarea class="obs-textarea" oninput="edicionTemp.observaciones=this.value" placeholder="Sin observaciones">${edicionTemp.observaciones}</textarea>
    </div>
    <div class="otra-escuela-edit">
      <div class="check-row"><input type="checkbox" ${edicionTemp.otraEscuelaCheck?'checked':''} onchange="toggleOtraEscuelaEdit()"> El alumno proviene de otra escuela</div>
      ${edicionTemp.otraEscuelaCheck ? `<input type="text" placeholder="Escuela de origen" value="${edicionTemp.escuelaOrigen}" oninput="edicionTemp.escuelaOrigen=this.value">` : ''}
    </div>
  ` : `
    <div class="campo-icono"><span class="ic">🆔</span><b>DNI:</b><span class="val">${alumno.dni}</span></div>
    <div class="campo-icono"><span class="ic">🎓</span><b>Curso:</b><span class="val">${curso.nombre}</span></div>
    <div class="campo-icono"><span class="ic">📅</span><b>Fecha de nacimiento:</b><span class="val">${extra.nacimiento}</span></div>
    <div class="campo-icono"><span class="ic">📍</span><b>Domicilio:</b><span class="val">${extra.direccion}</span></div>
    <div class="campo-icono"><span class="ic">📞</span><b>Teléfono:</b><span class="val">${extra.tel}</span></div>
    <div class="campo-icono"><span class="ic">👤</span><b>Tutor:</b><span class="val">${extra.tutor}</span></div>
    <div class="campo-icono"><span class="ic">✉️</span><b>Email:</b><span class="val">${extra.mail}</span></div>
    ${extra.observaciones ? `<div class="campo-icono"><span class="ic">📝</span><b>Observaciones:</b><span class="val">${extra.observaciones}</span></div>` : ''}
  `;

  const docCheckList = DOC_KEYS.map(([key,label]) => {
    const val = documentos[key];
    if(editando){
      return `<div class="doc-check-item"><input type="checkbox" ${val?'checked':''} onchange="toggleDocumentoEdit('${key}')"> ${label}</div>`;
    }
    return `<div class="doc-check-item"><span class="chk ${val?'si':'no'}">${val?'✓':'—'}</span> ${label}</div>`;
  }).join('');

  return `
    <div class="legajo-top">
      <div class="titulo-wrap">
        <div class="icono-cuadrado">🎓</div>
        <div><h2>Legajo del Alumno</h2><p>Información completa del alumno</p></div>
      </div>
      <button class="btn-volver-lista" onclick="volverDesdeFicha()">&#8592; Volver a la lista</button>
    </div>

    <div class="legajo-grid">
      <div class="legajo-card">
        <div class="avatar-generico">👤</div>
        <div class="legajo-nombre-row">
          <span class="nombre-al">${alumno.nombre}</span>
          <span class="pill-estado ${estadoPillClass}">${alumno.estado}</span>
        </div>
        <div class="campo-icono-list">${camposIzq}</div>
      </div>
      <div class="legajo-card">
        <h4>Documentación entregada</h4>
        <div class="doc-check-list">${docCheckList}</div>
      </div>
    </div>

    ${extra.otraEscuela && !editando ? `<div class="procedencia-card"><div class="icono">🔁</div><div><b>Alumno proveniente de otra escuela.</b><br>${extra.otraEscuela}</div></div>` : ''}

    ${esProximoAEgresar ? `
      <div class="egreso-card">
        <div class="titulo-egreso">🎓 Próximo a egresar</div>
        <p>Al generar el título se guarda en PDF, se envía al correo personal del alumno (${extra.gmail}) y el legajo se archiva automáticamente en "Legajos Egresados".</p>
        <button class="btn-titulo" onclick="generarTitulo('${cursoId}','${dni}','${alumno.nombre}','${extra.gmail}')">Generar título (PDF) y enviar por correo</button>
      </div>
    ` : ''}

    ${toastMsg ? `<div class="toast ${toastTipo==='error'?'toast-error':''}" style="max-width:640px;">${toastMsg}</div>` : ''}

    <div class="acciones-centradas">
      ${editando ? `
        <button class="btn-editar" onclick="guardarEdicion('${dni}')">Guardar cambios</button>
        <button class="btn-secundario" onclick="cancelarEdicion()">Cancelar</button>
      ` : `
        ${editable ? `<button class="btn-editar" onclick="iniciarEdicion('${dni}')">&#9998; Editar</button>` : ''}
        ${puedeDescargarPDF() ? `<button class="btn-secundario" onclick="descargarPDF('${alumno.nombre}')">&#11015; Descargar PDF</button>` : ''}
      `}
    </div>
  `;
}

function modalConfirmLogout(){
  return `
    <div class="overlay" onclick="if(event.target===this) cancelarLogout()">
      <div class="modal-curso" style="max-width:380px;">
        <div class="modal-body" style="text-align:center;padding:30px 24px;">
          <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
          <h3 style="color:var(--rojo);margin:0 0 8px;font-size:18px;">¿Cerrar sesión?</h3>
          <p style="font-size:13.5px;color:#3a3f55;margin:0 0 22px;">¿Estás seguro que querés cerrar sesión?</p>
          <div style="display:flex;gap:10px;justify-content:center;">
            <button class="btn-secundario" onclick="cancelarLogout()">Cancelar</button>
            <button style="background:var(--rojo);color:#fff;border:none;padding:9px 18px;border-radius:7px;font-weight:700;font-size:13px;cursor:pointer;" onclick="confirmarLogout()">Sí, cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
